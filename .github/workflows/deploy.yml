name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Both values are public: they ship in the browser build, and row
          # level security protects the data. Never put a secret here.
          VITE_SUPABASE_URL: https://hkekodbxzibqelynbeze.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhrZWtvZGJ4emlicWVseW5iZXplIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM3MzQ1OTcsImV4cCI6MjEwOTMxMDU5N30.tLD0hRnBlCWMN6LQpuEDuul-YYR73Et-DLBDTxBQz20
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
